[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "igprompts"
version = "0.6.0"
description = "Model-agnostic Instagram growth prompt library and automated content workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SanHsien", email = "sanhsien@users.noreply.github.com" }
]
keywords = [
    "instagram",
    "growth",
    "prompts",
    "workflow",
    "reels",
    "carousel",
    "content-creator",
    "ai-agent",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/SanHsien/ig-growth-prompts"
Repository = "https://github.com/SanHsien/ig-growth-prompts.git"
Issues = "https://github.com/SanHsien/ig-growth-prompts/issues"
Changelog = "https://github.com/SanHsien/ig-growth-prompts/blob/main/CHANGELOG.md"

[project.scripts]
igprompts = "igprompts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["igprompts*"]
