name: Build and Release Windows GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.5.0 or v0.5.0-beta.1). Leave empty to use git tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  verify-semver:
    name: Verify Semantic Versioning
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Semantic Tag
        id: gate
        shell: bash
        run: |
          set -e
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            # Extract version from igprompts/__init__.py
            VER=$(python -c 'import re; print(re.search(r"__version__\s*=\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]", open("igprompts/__init__.py").read()).group(1))')
            TAG_NAME="v${VER}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::❌ Invalid tag format: '$TAG_NAME'. Must conform to SemVer (e.g. v0.5.0 or v0.5.0-beta.1)!"
            exit 1
          fi

          if [[ "$TAG_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build Portable and Installer Assets
    needs: verify-semver
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Build Tools (PyInstaller & Inno Setup)
        shell: pwsh
        run: |
          pip install pyinstaller
          choco install innosetup -y
          # Add Inno Setup to PATH
          $InnoPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $InnoPath) {
              echo "$InnoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify Quality Gate
        shell: pwsh
        run: ./tools/dev_check.ps1

      - name: Compile Portable Executable and Setup Installer
        shell: pwsh
        run: ./tools/build_exe.ps1 -OutputDir dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: igprompts-windows-binaries
          path: dist/
          retention-days: 14

      - name: Publish Release Assets to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify-semver.outputs.release_tag }}
          prerelease: ${{ needs.verify-semver.outputs.is_prerelease == 'true' }}
          files: |
            dist/igprompts-gui-*-portable.exe
            dist/igprompts-setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
